[project]
name = "ctf-agent-two"
version = "0.1.0"
description = "Agentic offensive security — TSecBench headless solver swarm"
requires-python = ">=3.14"
dependencies = [
    # Lower bounds = versions this branch was developed and verified against;
    # exact pins live in uv.lock (committed, reproducible installs).
    "pydantic-ai>=2.56.0",
    "openai>=3.30.0",
    "pydantic-settings>=2.15.0",
    "genai-prices>=0.1.11",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "click>=8.5.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ctf-solve = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PTH"]
ignore = ["E501", "SIM105", "SIM115", "PTH123"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ty.environment]
python-version = "3.14"
